  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ARS Traders - Web Admin Dashboard">

  <script>
    // Sellers quick access: Cmd+Option+S / Ctrl+Alt+S — capture phase so Flutter can open dialog
    document.addEventListener('keydown', function(e) {
      if ((e.key === 's' || e.key === 'S') && (e.metaKey || e.ctrlKey) && e.altKey) {
        e.preventDefault();
        e.stopPropagation();
        window.dispatchEvent(new CustomEvent('sellers-quick-access'));
      }
    }, true);

    // Error handling for script loading
    window.addEventListener('error', function(e) {
      console.error('Script loading error:', e.filename, e.message, e.lineno, e.colno);
    }, true);

    // Your web app's Firebase configuration
  const firebaseConfig = {
      apiKey: "AIzaSyA2uHnjmgxmfOsAy-WhoOFFnLqWsCZM95A",
      authDomain: "ha-app-locker.firebaseapp.com",
      projectId: "ha-app-locker",
      storageBucket: "ha-app-locker.firebasestorage.app",
      messagingSenderId: "192454194116",
      appId: "1:192454194116:web:7deca409cbad5b2c84ea91",
      measurementId: "G-DGZKRQ64PE"
};
    
    // Initialize Firebase with error handling
    try {
      if (typeof firebase !== 'undefined') {
        firebase.initializeApp(firebaseConfig);
        console.log('Firebase initialized successfully');
      } else {
        console.error('Firebase SDK not loaded');
      }
    } catch (error) {
      console.error('Firebase initialization error:', error);
    }
  </script>
  
  <!-- Web Bluetooth API for printer support -->

  <script>
    // Ensure functions are available on window
    window.addEventListener('load', function() {
      console.log('Page loaded, checking printer scripts...');
      console.log('Bluetooth printer script loaded');
      console.log('requestBluetoothDeviceWithCallback available:', typeof window.requestBluetoothDeviceWithCallback !== 'undefined');
      console.log('USB printer script loaded');
      console.log('isUsbAvailable available:', typeof window.isUsbAvailable !== 'undefined');
    });
  </script>
</head>
